<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delhi Seva Finder - Connecting You to Help & Resources</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
    
    body { 
      background-color: #f8fafc;
      background-image: 
        radial-gradient(at 0% 0%, rgba(249, 115, 22, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(2, 132, 199, 0.08) 0px, transparent 50%),
        radial-gradient(at 50% 100%, rgba(16, 185, 129, 0.08) 0px, transparent 50%);
      color: #0f172a;
      min-height: 100vh;
      position: relative;
    }

    /* Subtle Parliament / Civic Grid Watermark */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
      background-size: 24px 24px;
      opacity: 0.5;
      z-index: -1;
    }

    .container { max-width: 1180px; margin: 0 auto; padding: 20px 15px 50px 15px; }
    
    /* Header Area */
    header { 
      text-align: center; 
      margin-bottom: 25px; 
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo-container {
      background: #ffffff;
      padding: 16px 28px;
      border-radius: 20px;
      box-shadow: 0 10px 25px -5px rgba(2, 132, 199, 0.08), 0 4px 10px rgba(0,0,0,0.03);
      border: 1px solid #e2e8f0;
      margin-bottom: 12px;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
    }
    
    .header-tagline {
      display: inline-block;
      background: #ffffff;
      color: #0369a1;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      padding: 6px 18px;
      border-radius: 30px;
      border: 1px solid #bae6fd;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    /* Search & Filter Bar */
    .controls-wrapper {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 14px 18px;
      margin-bottom: 25px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: center;
      justify-content: space-between;
    }

    .search-box {
      flex: 1;
      min-width: 280px;
      position: relative;
    }

    .search-input { 
      width: 100%;
      padding: 13px 16px 13px 44px; 
      background: #f8fafc; 
      border: 1.5px solid #cbd5e1; 
      border-radius: 10px; 
      color: #0f172a; 
      font-size: 15px; 
      font-weight: 500;
      outline: none; 
      transition: all 0.2s ease;
    }

    .search-input:focus { 
      border-color: #0284c7; 
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.12);
    }

    .search-icon {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
      font-size: 16px;
    }

    .category-select { 
      padding: 13px 18px; 
      background: #f8fafc; 
      border: 1.5px solid #cbd5e1; 
      border-radius: 10px; 
      color: #0f172a; 
      font-size: 14px; 
      font-weight: 600;
      outline: none; 
      cursor: pointer;
    }

    .category-select:focus {
      border-color: #0284c7;
      background: #fff;
    }

    /* Cards Grid */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 22px; }
    
    .card { 
      background: #ffffff; 
      border: 1px solid #e2e8f0; 
      border-radius: 16px; 
      padding: 22px; 
      display: flex; 
      flex-direction: column; 
      justify-content: space-between; 
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.04);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .card:hover { 
      transform: translateY(-4px); 
      box-shadow: 0 16px 30px -8px rgba(15, 23, 42, 0.1); 
      border-color: #38bdf8;
    }
    
    .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    
    .badge { 
      background: #eff6ff; 
      color: #1d4ed8; 
      font-size: 12px; 
      padding: 4px 12px; 
      border-radius: 20px; 
      font-weight: 700;
      border: 1px solid #bfdbfe;
    }

    .fee-tag { 
      background: #ecfdf5; 
      color: #047857; 
      font-size: 13px; 
      padding: 4px 12px; 
      border-radius: 8px; 
      font-weight: 800;
      border: 1px solid #a7f3d0;
    }
    
    .card h3 { 
      font-size: 18px; 
      font-weight: 700;
      color: #0f172a; 
      margin-bottom: 8px; 
      line-height: 1.35;
    }

    .desc { 
      font-size: 13.5px; 
      color: #64748b; 
      margin-bottom: 16px; 
      line-height: 1.5; 
    }
    
    .meta-box { 
      background: #f8fafc; 
      border: 1px solid #f1f5f9;
      padding: 10px 14px; 
      border-radius: 10px; 
      font-size: 12.5px; 
      color: #334155; 
      margin-bottom: 16px; 
    }

    .meta-box div { margin-bottom: 5px; }
    .meta-box div:last-child { margin-bottom: 0; }
    
    .doc-section h4 { 
      font-size: 12.5px; 
      color: #0369a1; 
      text-transform: uppercase; 
      margin-bottom: 10px; 
      letter-spacing: 0.5px; 
      font-weight: 800;
    }

    .doc-list { list-style: none; font-size: 13px; color: #334155; }
    .doc-list li { margin-bottom: 8px; position: relative; padding-left: 20px; line-height: 1.4; }
    .doc-list li::before { 
      content: "✓"; 
      position: absolute; 
      left: 0; 
      color: #059669; 
      font-weight: 900; 
      font-size: 14px;
    }
    
    .copy-btn { 
      margin-top: 18px; 
      width: 100%; 
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); 
      color: #ffffff; 
      border: none; 
      padding: 11px 16px; 
      border-radius: 10px; 
      cursor: pointer; 
      font-size: 13.5px; 
      font-weight: 700;
      box-shadow: 0 4px 10px rgba(2, 132, 199, 0.2);
    }

    .copy-btn:hover { opacity: 0.92; }

    footer { 
      text-align: center; 
      margin-top: 45px; 
      border-top: 1px solid #cbd5e1; 
      padding-top: 25px; 
      color: #64748b; 
      font-size: 13px; 
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="logo-container">
        <!-- Direct Embedded Vector Graphic of Delhi Seva Finder Logo -->
        <svg width="290" height="110" viewBox="0 0 400 150" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="saffronG" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#FF9933"/>
              <stop offset="100%" stop-color="#FF6600"/>
            </linearGradient>
            <linearGradient id="blueG" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#0284c7"/>
              <stop offset="100%" stop-color="#003366"/>
            </linearGradient>
            <linearGradient id="greenG" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#10b981"/>
              <stop offset="100%" stop-color="#047857"/>
            </linearGradient>
          </defs>

          <!-- Unity Circle (People holding hands around India Gate) -->
          <circle cx="200" cy="50" r="38" stroke="url(#greenG)" stroke-width="3.5" fill="none" stroke-dasharray="160 20"/>
          
          <!-- Citizens Icon Heads -->
          <circle cx="200" cy="10" r="6" fill="#f97316"/>
          <circle cx="165" cy="25" r="5" fill="#0284c7"/>
          <circle cx="235" cy="25" r="5" fill="#10b981"/>

          <!-- India Gate Silhouette -->
          <rect x="180" y="24" width="40" height="6" rx="2" fill="url(#saffronG)"/>
          <rect x="184" y="30" width="8" height="34" fill="#0284c7"/>
          <rect x="208" y="30" width="8" height="34" fill="#10b981"/>
          <path d="M192 40 C192 46 208 46 208 40 Z" fill="#ffffff"/>
          <rect x="176" y="64" width="48" height="4" rx="1" fill="#334155"/>

          <!-- Search Magnifying Glass with Shaking Hands -->
          <circle cx="170" cy="58" r="18" fill="#ffffff" stroke="url(#saffronG)" stroke-width="4"/>
          <line x1="156" y1="72" x2="142" y2="86" stroke="#0284c7" stroke-width="6" stroke-linecap="round"/>
          
          <!-- Handshake Icon inside Magnifier -->
          <path d="M162 58 L168 54 L174 60 L178 56" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M165 62 L171 58" stroke="#f97316" stroke-width="2" stroke-linecap="round"/>

          <!-- Typography -->
          <text x="200" y="112" font-size="25" font-weight="900" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">
            <tspan fill="#003366">DELHI SEVA</tspan><tspan fill="#FF9933">·FINDER</tspan>
          </text>
          <text x="200" y="132" font-size="9.5" font-weight="700" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle" letter-spacing="1.5">
            CONNECTING YOU TO HELP & RESOURCES
          </text>
        </svg>
      </div>
      <div>
        <span class="header-tagline">Official Govt Fees, Processing Time & Documents Portal</span>
      </div>
    </header>

    <div class="controls-wrapper">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" class="search-input" placeholder="Search any service (e.g. Ration Card, Passport, DL, Lakshmi Yojna)..." oninput="renderServices()">
      </div>
      
      <select id="categorySelect" class="category-select" onchange="renderServices()">
        <option value="All">All Categories</option>
        <option value="Identity">Identity (Aadhaar / PAN / Voter)</option>
        <option value="Certificates">Certificates (Caste / Income / EWS)</option>
        <option value="Transport">Transport (DL / RC)</option>
        <option value="Passport">Passport & PCC</option>
        <option value="Pension">Pension</option>
        <option value="Schemes">Schemes & Welfare</option>
      </select>
    </div>

    <div id="serviceGrid" class="grid"></div>

    <footer>
      <p>Data synced with Delhi e-District, Parivahan Sewa, UIDAI & Passport Seva Official Portals.</p>
    </footer>
  </div>

  <script>

      },
      {

        name: "Delhi Police PCC (Police Clearance Certificate)",

        desc: "Background clearance certificate issued by Delhi Police Special Branch.",
        docs: [
          "Aadhaar Card & Passport Copy",
          "Delhi Address Proof (Electricity / Rent Agreement)",
          "Agency / Embassy Letter requiring PCC"
        ]
      },
      {
        id: 18,
        name: "Delhi Old Age & Widow Pension",
        category: "Pension",
        fee: "₹0 (Free)",
        time: "30 - 45 Days",
        eligibility: "Senior Citizens (60+) / Widows with Family Income < ₹1 Lakh",
        desc: "Monthly financial pension assistance of ₹2,000 - ₹2,500 by Delhi Govt.",
        docs: [
          "Aadhaar Card & Age Proof",
          "Delhi Residence Proof (Minimum 5 years residence)",
          "Income Certificate / BPL Card",
          "Single Operator Bank Passbook (Aadhaar linked)",
          "Death Certificate of Husband (for Widow Pension)"
        ]
      },
      {
        id: 19,
        name: "Delhi Mukhyamantri Mahila Samman / Lakshmi Yojna",
        category: "Schemes",
        fee: "₹0 (Free)",
        time: "21 - 30 Days",
        eligibility: "Delhi female resident (Age 18+), Delhi Voter ID holder, Non-taxpayer",
        desc: "Monthly financial assistance of ₹2,500 for adult women in Delhi.",
        docs: [
          "Aadhaar Card (Mobile Number linked)",
          "Delhi Voter ID Card (Mandatory for Delhi residency proof)",
          "Bank Account Passbook (Aadhaar linked / DBT enabled)",
          "Self-Declaration Form (Non-taxpayer & non-govt employee)",
          "Passport Size Photograph"
        ]
      }
    ];

    const currentServices = (typeof servicesData !== 'undefined') ? servicesData : defaultData;

    function renderServices() {
      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      const cat = document.getElementById('categorySelect').value;
      const grid = document.getElementById('serviceGrid');

      const filtered = currentServices.filter(s => {
        const matchesQuery = s.name.toLowerCase().includes(q) || 
                             s.desc.toLowerCase().includes(q) || 
                             s.docs.some(d => d.toLowerCase().includes(q));
        const matchesCat = cat === 'All' || s.category === cat;
        return matchesQuery && matchesCat;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:50px; background:#fff; border-radius:16px; border:1px solid #e2e8f0; color:#64748b; font-weight:600;">Koi service nahi mili. Search query change karke dekhein.</div>`;
        return;
      }

      grid.innerHTML = filtered.map(s => `
        <div class="card">
          <div>
            <div class="card-top">
              <span class="badge">${s.category}</span>
              <span class="fee-tag">${s.fee}</span>
            </div>
            <h3>${s.name}</h3>
            <p class="desc">${s.desc}</p>
            
            <div class="meta-box">
              <div>⏱️ <b>Processing Time:</b> ${s.time}</div>
              <div>🎯 <b>Eligibility:</b> ${s.eligibility}</div>
            </div>

            <div class="doc-section">
              <h4>Required Documents Checklist:</h4>
              <ul class="doc-list">
                ${s.docs.map(doc => `<li>${doc}</li>`).join('')}
              </ul>
            </div>
          </div>

          <button class="copy-btn" onclick="copyChecklist('${s.name}', ${JSON.stringify(s.docs).replace(/"/g, '&quot;')})">📋 Copy Checklist</button>
        </div>
      `).join('');
    }

    function copyChecklist(title, docs) {
      const text = `📋 *${title} - Required Documents*\n\n` + docs.map((d, i) => `${i+1}. ${d}`).join('\n') + `\n\n📌 Check complete details on Delhi Seva Finder:\n` + window.location.href;
      navigator.clipboard.writeText(text);
      alert(`"${title}" checklist copied to clipboard!`);
    }

    window.onload = renderServices;
  </script>
</body>
</html>
