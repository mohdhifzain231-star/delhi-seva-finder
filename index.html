<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delhi Seva Finder - Verified Government Services & Documents</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏛️</text></svg>">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; padding: 25px 15px; }
    .container { max-width: 1100px; margin: 0 auto; }
    
    header { text-align: center; margin-bottom: 30px; }
    header h1 { font-size: 28px; color: #60a5fa; margin-bottom: 8px; }
    header p { color: #94a3b8; font-size: 15px; }

    .controls { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 25px; justify-content: center; }
    .search-input { flex: 1; min-width: 260px; max-width: 450px; padding: 12px 16px; background: #1e293b; border: 1px solid #334155; border-radius: 8px; color: #fff; font-size: 15px; outline: none; }
    .search-input:focus { border-color: #3b82f6; }
    .category-select { padding: 12px 16px; background: #1e293b; border: 1px solid #334155; border-radius: 8px; color: #fff; font-size: 15px; outline: none; cursor: pointer; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; transition: transform 0.2s, border-color 0.2s; }
    .card:hover { transform: translateY(-3px); border-color: #3b82f6; }
    
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
    .badge { background: #1e3a8a; color: #93c5fd; font-size: 12px; padding: 4px 10px; border-radius: 20px; font-weight: 600; }
    .fee-tag { background: #064e3b; color: #6ee7b7; font-size: 13px; padding: 4px 10px; border-radius: 6px; font-weight: bold; }
    
    .card h3 { font-size: 18px; color: #f1f5f9; margin-bottom: 8px; }
    .desc { font-size: 13px; color: #94a3b8; margin-bottom: 15px; line-height: 1.4; }
    
    .meta-box { background: #0f172a; padding: 10px 12px; border-radius: 6px; font-size: 12px; color: #cbd5e1; margin-bottom: 15px; }
    .meta-box div { margin-bottom: 4px; }
    .meta-box div:last-child { margin-bottom: 0; }
    
    .doc-section h4 { font-size: 13px; color: #60a5fa; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.5px; }
    .doc-list { list-style: none; font-size: 13px; color: #e2e8f0; }
    .doc-list li { margin-bottom: 6px; position: relative; padding-left: 18px; }
    .doc-list li::before { content: "✓"; position: absolute; left: 0; color: #10b981; font-weight: bold; }
    
    .copy-btn { margin-top: 15px; width: 100%; background: #334155; color: #f8fafc; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; }
    .copy-btn:hover { background: #475569; }

    footer { text-align: center; margin-top: 40px; border-top: 1px solid #334155; padding-top: 20px; color: #64748b; font-size: 13px; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>🏛️ Delhi Seva Finder</h1>
      <p>Official Government Fees, Processing Time & Required Documents Checklist</p>
    </header>

    <div class="controls">
      <input type="text" id="searchInput" class="search-input" placeholder="Search service (e.g. Ration, Passport, OBC, DL)..." oninput="renderServices()">
      <select id="categorySelect" class="category-select" onchange="renderServices()">
        <option value="All">All Categories</option>
        <option value="Identity">Identity (Aadhaar/PAN/Voter)</option>
        <option value="Certificates">Certificates (Caste/Income/EWS)</option>
        <option value="Transport">Transport (DL/RC)</option>
        <option value="Passport">Passport & PCC</option>
        <option value="Pension">Pension</option>
        <option value="Schemes">Schemes & Welfare</option>
      </select>
    </div>

    <div id="serviceGrid" class="grid"></div>

    <footer>
      <p>Data synced with Delhi e-District, Parivahan, UIDAI & Passport Seva Official Portals.</p>
    </footer>
  </div>

  <!-- Data.js file include -->
  <script src="data.js"></script>

  <script>
    function renderServices() {
      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      const cat = document.getElementById('categorySelect').value;
      const grid = document.getElementById('serviceGrid');

      const filtered = servicesData.filter(s => {
        const matchesQuery = s.name.toLowerCase().includes(q) || 
                             s.desc.toLowerCase().includes(q) || 
                             s.docs.some(d => d.toLowerCase().includes(q));
        const matchesCat = cat === 'All' || s.category === cat;
        return matchesQuery && matchesCat;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:40px; color:#94a3b8;">Koi matching service nahi mili. Search query change karke dekhein.</div>`;
        return;
      }

      grid.innerHTML = filtered.map(s => `
        <div class="card">
          <div>
            <div class="card-top">
              <span class="badge">${s.category}</span>
              <span class="fee-tag">${s.fee}</span>
            </div>
            <h3>${s.name}</h3>
            <p class="desc">${s.desc}</p>
            
            <div class="meta-box">
              <div>⏱️ <b>Time:</b> ${s.time}</div>
              <div>🎯 <b>Eligibility:</b> ${s.eligibility}</div>
            </div>

            <div class="doc-section">
              <h4>Required Documents:</h4>
              <ul class="doc-list">
                ${s.docs.map(doc => `<li>${doc}</li>`).join('')}
              </ul>
            </div>
          </div>

          <button class="copy-btn" onclick="copyChecklist('${s.name}', ${JSON.stringify(s.docs).replace(/"/g, '&quot;')})">📋 Copy Checklist</button>
        </div>
      `).join('');
    }

    function copyChecklist(title, docs) {
      const text = `📋 *${title} - Document Checklist*\n\n` + docs.map((d, i) => `${i+1}. ${d}`).join('\n') + `\n\n📌 Check official fees & details: ` + window.location.href;
      navigator.clipboard.writeText(text);
      alert(`"${title}" checklist copied to clipboard! Aap ise WhatsApp par bhej sakte hain.`);
    }

    // Initial render
    window.onload = renderServices;
  </script>
</body>
</html>
