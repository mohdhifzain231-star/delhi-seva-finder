<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="google-site-verification" content="google2bc5ee1a9f538f76" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delhi Seva Finder - Official Government Services & Documents</title>
  <link rel="icon" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
    
    body { 
      background-color: #f1f5f9;
      color: #0f172a;
      min-height: 100vh;
    }

    /* Custom Uploaded Parliament Landscape Banner */
    .hero-banner {
      width: 100%;
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.45) 0%, rgba(15, 23, 42, 0.8) 100%), 
                  url('parliament.jpg') no-repeat center 30%;
      background-size: cover;
      padding: 35px 15px 75px 15px;
      text-align: center;
      position: relative;
      border-bottom: 4px solid #0284c7;
    }

    .brand-logo-card {
      background: rgba(255, 255, 255, 0.98);
      padding: 14px 28px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.35);
      margin-bottom: 12px;
      display: inline-block;
    }

    .brand-logo {
      width: 100%;
      max-width: 310px;
      height: auto;
      display: block;
    }

    .header-tagline {
      display: inline-block;
      background: #ffffff;
      color: #0369a1;
      font-size: 13.5px;
      font-weight: 700;
      letter-spacing: 0.5px;
      padding: 7px 22px;
      border-radius: 30px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25);
    }

    .container { 
      max-width: 1180px; 
      margin: -35px auto 50px auto; 
      padding: 0 15px; 
      position: relative;
      z-index: 10;
    }

    .controls-wrapper {
      background: #ffffff;
      border: 1.5px solid #cbd5e1;
      border-radius: 18px;
      padding: 16px 20px;
      margin-bottom: 30px;
      box-shadow: 0 15px 30px -5px rgba(15, 23, 42, 0.12);
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: center;
      justify-content: space-between;
    }

    .search-box {
      flex: 1;
      min-width: 280px;
      position: relative;
    }

    .search-input { 
      width: 100%;
      padding: 14px 16px 14px 44px; 
      background: #f8fafc; 
      border: 1.5px solid #cbd5e1; 
      border-radius: 12px; 
      color: #0f172a; 
      font-size: 15px; 
      font-weight: 500;
      outline: none; 
      transition: all 0.2s ease;
    }

    .search-input:focus { 
      border-color: #0284c7; 
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.12);
    }

    .search-icon {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
      font-size: 16px;
    }

    .category-select { 
      padding: 14px 18px; 
      background: #f8fafc; 
      border: 1.5px solid #cbd5e1; 
      border-radius: 12px; 
      color: #0f172a; 
      font-size: 14px; 
      font-weight: 600;
      outline: none; 
      cursor: pointer;
    }

    .category-select:focus {
      border-color: #0284c7;
      background: #fff;
    }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 22px; }
    
    .card { 
      background: #ffffff; 
      border: 1px solid #e2e8f0; 
      border-radius: 16px; 
      padding: 22px; 
      display: flex; 
      flex-direction: column; 
      justify-content: space-between; 
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.04);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover { 
      transform: translateY(-4px); 
      box-shadow: 0 16px 30px -8px rgba(15, 23, 42, 0.1); 
    }
    
    .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    
    .badge { 
      background: #eff6ff; 
      color: #1d4ed8; 
      font-size: 12px; 
      padding: 4px 12px; 
      border-radius: 20px; 
      font-weight: 700;
      border: 1px solid #bfdbfe;
    }

    .fee-tag { 
      background: #ecfdf5; 
      color: #047857; 
      font-size: 13px; 
      padding: 4px 12px; 
      border-radius: 8px; 
      font-weight: 800;
      border: 1px solid #a7f3d0;
    }
    
    .card h3 { 
      font-size: 18px; 
      font-weight: 700;
      color: #0f172a; 
      margin-bottom: 8px; 
      line-height: 1.35;
    }

    .desc { 
      font-size: 13.5px; 
      color: #64748b; 
      margin-bottom: 16px; 
      line-height: 1.5; 
    }
    
    .meta-box { 
      background: #f8fafc; 
      border: 1px solid #f1f5f9;
      padding: 10px 14px; 
      border-radius: 10px; 
      font-size: 12.5px; 
      color: #334155; 
      margin-bottom: 16px; 
    }

    .meta-box div { margin-bottom: 5px; }
    .meta-box div:last-child { margin-bottom: 0; }
    
    .doc-section h4 { 
      font-size: 12.5px; 
      color: #0369a1; 
      text-transform: uppercase; 
      margin-bottom: 10px; 
      letter-spacing: 0.5px; 
      font-weight: 800;
    }

    .doc-list { list-style: none; font-size: 13px; color: #334155; }
    .doc-list li { margin-bottom: 8px; position: relative; padding-left: 20px; line-height: 1.4; }
    .doc-list li::before { 
      content: "✓"; 
      position: absolute; 
      left: 0; 
      color: #059669; 
      font-weight: 900; 
      font-size: 14px;
    }
    
    .copy-btn { 
      margin-top: 18px; 
      width: 100%; 
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); 
      color: #ffffff; 
      border: none; 
      padding: 11px 16px; 
      border-radius: 10px; 
      cursor: pointer; 
      font-size: 13.5px; 
      font-weight: 700;
      box-shadow: 0 4px 10px rgba(2, 132, 199, 0.2);
    }

    footer { 
      text-align: center; 
      margin-top: 45px; 
      border-top: 1px solid #cbd5e1; 
      padding-top: 25px; 
      color: #64748b; 
      font-size: 13px; 
      font-weight: 500;
    }
  </style>
</head>
<body>

  <!-- Uploaded Parliament Landscape Banner -->
  <header class="hero-banner">
    <div class="brand-logo-card">
      <img src="logo.png" alt="Delhi Seva Finder Logo" class="brand-logo">
    </div>
    <div>
      <span class="header-tagline">Official Govt Fees, Processing Time & Documents Portal</span>
    </div>
  </header>

  <div class="container">
    <div class="controls-wrapper">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" class="search-input" placeholder="Search any service (e.g. Ration Card, Passport, DL, Lakshmi Yojna)..." oninput="renderServices()">
      </div>
      
      <select id="categorySelect" class="category-select" onchange="renderServices()">
        <option value="All">All Categories</option>
        <option value="Identity">Identity (Aadhaar / PAN / Voter)</option>
        <option value="Certificates">Certificates (Caste / Income / EWS)</option>
        <option value="Transport">Transport (DL / RC)</option>
        <option value="Passport">Passport & PCC</option>
        <option value="Pension">Pension</option>
        <option value="Schemes">Schemes & Welfare</option>
      </select>
    </div>

    <div id="serviceGrid" class="grid"></div>

    <footer>
      <p>Data synced with Delhi e-District, Parivahan Sewa, UIDAI & Passport Seva Official Portals.</p>
    </footer>
  </div>

  <script src="data.js"></script>

  <script>
    const fallbackData = [
      { id: 1, name: "Aadhaar Card - New Enrolment", category: "Identity", fee: "₹0 (Free)", time: "15 - 30 Days", eligibility: "All Indian Residents", desc: "New 12-digit biometric identity card issued by UIDAI.", docs: ["Proof of Identity (Passport, Voter ID, PAN)", "Proof of Address (Electricity Bill, Rent Agreement)", "Proof of Date of Birth (Birth Certificate, 10th Marksheet)"] },
      { id: 2, name: "Aadhaar Card - Demographic Update", category: "Identity", fee: "₹50", time: "5 - 15 Days", eligibility: "Existing Aadhaar Holders", desc: "Update Name, Address, Date of Birth, Gender, or Mobile Number.", docs: ["Original Aadhaar Card", "Valid Proof for change", "Registered Mobile Number for OTP"] },
      { id: 3, name: "Aadhaar Card - Biometric Update", category: "Identity", fee: "₹100 (Free at age 5 & 15)", time: "5 - 15 Days", eligibility: "Existing Aadhaar Holders", desc: "Update fingerprints, iris scans, or photo.", docs: ["Original Aadhaar Card", "Parent/Guardian Aadhaar (for minors)"] },
      { id: 4, name: "PAN Card - New / Correction", category: "Identity", fee: "₹107 (Physical) / ₹0 (e-PAN)", time: "7 - 15 Days", eligibility: "Indian Citizens / Taxpayers", desc: "Permanent Account Number for banking & tax transactions.", docs: ["Aadhaar Card (Linked with Mobile)", "Proof of Identity & Address", "2 Passport Size Photographs"] },
      { id: 5, name: "Voter ID Card (Form 6)", category: "Identity", fee: "₹0 (Free)", time: "15 - 30 Days", eligibility: "Indian Citizens (Age 18+)", desc: "Voter registration by Election Commission of India.", docs: ["Age Proof (Birth Certificate / Aadhaar / 10th)", "Delhi Address Proof (Water/Electricity Bill)", "1 Passport Size Photograph"] },
      { id: 6, name: "Income Certificate", category: "Certificates", fee: "₹0 (Free)", time: "14 Days", eligibility: "Delhi Residents", desc: "Official income certificate issued by Delhi Revenue Dept on e-District.", docs: ["Aadhaar Card of Applicant", "Delhi Address Proof", "Self-Declaration of Family Income", "Salary Slip / ITR", "1 Passport Size Photograph"] },
      { id: 7, name: "OBC / SC / ST Caste Certificate", category: "Certificates", fee: "₹0 (Free)", time: "14 Days", eligibility: "Delhi Residents in reserved categories", desc: "Caste certificate issued by SDM Office via Delhi e-District.", docs: ["Aadhaar Card of Applicant", "Father's Caste Certificate", "Delhi Residence Proof before 1993 (for OBC)", "Self-Declaration Form"] },
      { id: 8, name: "EWS Certificate", category: "Certificates", fee: "₹0 (Free)", time: "21 Days", eligibility: "Annual Family Income < ₹8 Lakh", desc: "10% reservation certificate for general category in admissions & jobs.", docs: ["Aadhaar Cards of family members", "Income Proof / ITR of last 3 years", "Property Documents", "Delhi Residence Proof"] },
      { id: 9, name: "Domicile Certificate", category: "Certificates", fee: "₹0 (Free)", time: "14 Days", eligibility: "Delhi Resident for 3+ years", desc: "Certificate proving permanent residence in Delhi.", docs: ["Applicant Aadhaar Card", "Continuous 3 years residence proof", "Self-Declaration Form"] },
      { id: 10, name: "Birth / Death Certificate", category: "Certificates", fee: "₹21 per copy", time: "3 - 7 Days", eligibility: "Births/deaths registered in Delhi MCD", desc: "Official civil registration certificates by MCD / NDMC.", docs: ["Hospital Discharge / Birth Slip", "Aadhaar of Parents / Informant", "Identity Proof of Deceased"] },
      { id: 11, name: "Learner Licence (LL)", category: "Transport", fee: "₹200", time: "Instant (Online Test)", eligibility: "Age 16+ (MCWOG) / Age 18+ (LMV)", desc: "Contactless faceless Learner Driving Licence via Parivahan Delhi.", docs: ["Aadhaar Card (Faceless test)", "Age Proof (10th Marksheet / Birth Cert)", "Self-Declaration Medical Fitness"] },
      { id: 12, name: "Permanent Driving Licence (DL)", category: "Transport", fee: "₹500", time: "7 - 14 Days", eligibility: "Valid Learner Licence Holder", desc: "Permanent Driving Licence issued after driving test.", docs: ["Valid Learner Licence Number", "Aadhaar Card", "Slot Booking Receipt"] },
      { id: 13, name: "Driving Licence Renewal", category: "Transport", fee: "₹200", time: "7 - 10 Days", eligibility: "Existing DL Holders", desc: "Online faceless DL renewal without visiting RTO.", docs: ["Original Driving Licence", "Aadhaar Card", "Medical Certificate (Form 1A if age > 40)"] },
      { id: 14, name: "Vehicle RC Ownership Transfer", category: "Transport", fee: "₹150 - ₹500", time: "15 - 21 Days", eligibility: "Buyer & Seller of vehicle", desc: "Transfer of Registration Certificate on vehicle sale.", docs: ["Original RC", "Form 29 & Form 30", "Valid Insurance & Active PUCC", "Aadhaar of Buyer"] },
      { id: 15, name: "Fresh Passport (Normal)", category: "Passport", fee: "₹1,500", time: "15 - 30 Days", eligibility: "Indian Citizens", desc: "Standard 10-year validity passport via PSK.", docs: ["Aadhaar Card", "Proof of Date of Birth", "Non-ECR Proof (Class 10th / Degree)"] },
      { id: 16, name: "Tatkaal Passport", category: "Passport", fee: "₹3,500", time: "1 - 3 Days", eligibility: "Urgent travel requirements", desc: "Expedited passport issuance under Tatkaal scheme.", docs: ["Aadhaar Card", "PAN / Voter ID / Bank Passbook", "Annexure-E Self-Declaration"] },
      { id: 17, name: "Delhi Police PCC", category: "Passport", fee: "₹250 - ₹500", time: "7 - 14 Days", eligibility: "Delhi residents applying for visa/job", desc: "Background clearance certificate by Delhi Police Special Branch.", docs: ["Aadhaar Card & Passport Copy", "Delhi Address Proof", "Agency / Embassy Letter"] },
      { id: 18, name: "Delhi Old Age & Widow Pension", category: "Pension", fee: "₹0 (Free)", time: "30 - 45 Days", eligibility: "Senior Citizens (60+) / Widows", desc: "Monthly pension assistance of ₹2,000 - ₹2,500 by Delhi Govt.", docs: ["Aadhaar Card & Age Proof", "Delhi Residence Proof (5+ years)", "Income Certificate / BPL Card", "Single Operator Bank Passbook"] },
      { id: 19, name: "Delhi Mukhyamantri Mahila Samman / Lakshmi Yojna", category: "Schemes", fee: "₹0 (Free)", time: "21 - 30 Days", eligibility: "Delhi female resident (Age 18+)", desc: "Monthly financial assistance of ₹2,500 for adult women in Delhi.", docs: ["Aadhaar Card (Mobile linked)", "Delhi Voter ID Card", "Bank Account Passbook (DBT enabled)", "Self-Declaration Form"] },
      { id: 20, name: "E Shram Card", category: "Schemes", fee: "₹0 (Free) / ₹100", time: "Instant", eligibility: "Unorganised Workers (Age: 16-59)", desc: "Central Government welfare scheme for unorganised sector workers.", docs: ["Aadhaar Card", "Aadhaar-Linked Mobile Number", "Bank Account Details"] }
    ];

    function getActiveData() {
      if (typeof servicesData !== 'undefined' && Array.isArray(servicesData) && servicesData.length > 0) {
        return servicesData;
      }
      return fallbackData;
    }

    function renderServices() {
      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      const cat = document.getElementById('categorySelect').value;
      const grid = document.getElementById('serviceGrid');
      const dataList = getActiveData();

      const filtered = dataList.filter(s => {
        const matchesQuery = s.name.toLowerCase().includes(q) || 
                             s.desc.toLowerCase().includes(q) || 
                             s.docs.some(d => d.toLowerCase().includes(q));
        const matchesCat = cat === 'All' || s.category === cat;
        return matchesQuery && matchesCat;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:50px; background:#fff; border-radius:16px; border:1px solid #e2e8f0; color:#64748b; font-weight:600;">Koi service nahi mili. Search query change karke dekhein.</div>`;
        return;
      }

      grid.innerHTML = filtered.map(s => `
        <div class="card">
          <div>
            <div class="card-top">
              <span class="badge">${s.category}</span>
              <span class="fee-tag">${s.fee}</span>
            </div>
            <h3>${s.name}</h3>
            <p class="desc">${s.desc}</p>
            
            <div class="meta-box">
              <div>⏱️ <b>Processing Time:</b> ${s.time}</div>
              <div>🎯 <b>Eligibility:</b> ${s.eligibility}</div>
            </div>

            <div class="doc-section">
              <h4>Required Documents Checklist:</h4>
              <ul class="doc-list">
                ${s.docs.map(doc => `<li>${doc}</li>`).join('')}
              </ul>
            </div>
          </div>

          <button class="copy-btn" onclick="copyChecklist('${s.name}', ${JSON.stringify(s.docs).replace(/"/g, '&quot;')})">📋 Copy Checklist</button>
        </div>
      `).join('');
    }

    function copyChecklist(title, docs) {
      const text = `📋 *${title} - Required Documents*\n\n` + docs.map((d, i) => `${i+1}. ${d}`).join('\n') + `\n\n📌 Check complete details on Delhi Seva Finder:\n` + window.location.href;
      navigator.clipboard.writeText(text);
      alert(`"${title}" checklist copied!`);
    }

    window.onload = renderServices;
  </script>
</body>
</html>
