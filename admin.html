<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal - Delhi Seva AI Manager</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚙️</text></svg>">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; padding: 25px 15px; }
    .container { max-width: 800px; margin: 0 auto; }
    header { border-bottom: 1px solid #334155; padding-bottom: 15px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 20px; color: #60a5fa; }
    .nav-link { color: #94a3b8; text-decoration: none; font-size: 13px; }
    .nav-link:hover { color: #fff; }
    .panel { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 20px; margin-bottom: 20px; }
    h2 { font-size: 15px; margin-bottom: 12px; color: #cbd5e1; text-transform: uppercase; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 5px; font-weight: 500; }
    input[type="text"], input[type="password"], textarea, select { width: 100%; padding: 10px 12px; background: #0f172a; border: 1px solid #475569; border-radius: 6px; color: #fff; font-size: 14px; outline: none; }
    input:focus, textarea:focus, select:focus { border-color: #3b82f6; }
    .btn { background: #2563eb; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600; }
    .btn:hover { background: #1d4ed8; }
    .btn-success { background: #10b981; }
    .btn-clear { background: #475569; margin-left: 8px; }
    .review-box { display: none; background: #111827; border: 2px dashed #3b82f6; border-radius: 10px; padding: 20px; margin-top: 20px; }
    .badge-status { background: #fbbf24; color: #78350f; font-size: 11px; padding: 3px 8px; border-radius: 4px; font-weight: bold; }
    .loader { display: none; color: #60a5fa; font-size: 14px; margin-top: 10px; }
    .error-box { display: none; background: #450a0a; border: 1px solid #dc2626; color: #fca5a5; padding: 12px; border-radius: 6px; font-size: 13px; margin-top: 12px; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>⚙️ Delhi Seva AI Admin Manager</h1>
      <a href="index.html" class="nav-link" target="_blank">Live Website &rarr;</a>
    </header>

    <!-- Gemini API Key Setup -->
    <div class="panel">
      <h2>1. AI Config (Google Gemini API)</h2>
      <div class="form-group">
        <label>Gemini API Key (aistudio.google.com se li hui):</label>
        <input type="password" id="geminiApiKey" placeholder="AIzaSy..." />
      </div>
      <button class="btn" onclick="saveApiKey()">Save API Key</button>
    </div>

    <!-- AI Scheme Extractor -->
    <div class="panel">
      <h2>2. AI Scheme & Service Extractor</h2>
      <p style="font-size:13px; color:#94a3b8; margin-bottom:12px;">Kisi bhi service ya nayi sarkari scheme ka naam/text likhein:</p>
      
      <div class="form-group">
        <label>Service / Scheme Name or Details:</label>
        <textarea id="rawInput" rows="4" placeholder="Jaise: 'Delhi Mukhyamantri Mahila Samman Yojana 2024'"></textarea>
      </div>
      <button class="btn" onclick="analyzeWithAI()">🤖 Run AI Analysis</button>
      <div id="loader" class="loader">AI data analyze kar raha hai... Kripya 3-5 seconds rukiye...</div>
      <div id="errorBox" class="error-box"></div>

      <!-- Review Box -->
      <div id="reviewBox" class="review-box">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
          <h3 style="color:#60a5fa; font-size:16px;">AI Generated Draft (Verify & Edit)</h3>
          <span class="badge-status">PENDING APPROVAL</span>
        </div>

        <div class="form-group">
          <label>Service / Scheme Name:</label>
          <input type="text" id="draftName" />
        </div>

        <div class="form-group">
          <label>Category:</label>
          <select id="draftCategory">
            <option value="Identity">Identity</option>
            <option value="Certificates">Certificates</option>
            <option value="Transport">Transport</option>
            <option value="Passport">Passport</option>
            <option value="Pension">Pension</option>
            <option value="Scholarship">Scholarship</option>
            <option value="Schemes">Schemes</option>
          </select>
        </div>

        <div class="form-group">
          <label>Official Govt Fee:</label>
          <input type="text" id="draftFee" placeholder="₹0 (Free)" />
        </div>

        <div class="form-group">
          <label>Processing Time:</label>
          <input type="text" id="draftTime" placeholder="15 Days" />
        </div>

        <div class="form-group">
          <label>Eligibility:</label>
          <input type="text" id="draftEligibility" />
        </div>

        <div class="form-group">
          <label>Description:</label>
          <textarea id="draftDesc" rows="2"></textarea>
        </div>

        <div class="form-group">
          <label>Required Documents (Har line mein ek document):</label>
          <textarea id="draftDocs" rows="4"></textarea>
        </div>

        <button class="btn btn-success" onclick="approveAndCopy()">✅ Approve & Copy Service Data</button>
        <button class="btn btn-clear" onclick="document.getElementById('reviewBox').style.display='none'">Discard</button>
      </div>
    </div>
  </div>

  <script>
    window.onload = function() {
      const savedKey = localStorage.getItem('gemini_api_key');
      if (savedKey) document.getElementById('geminiApiKey').value = savedKey;
    };

    function saveApiKey() {
      const key = document.getElementById('geminiApiKey').value.trim();
      if (!key) return alert('Kripya valid API key dalein.');
      localStorage.setItem('gemini_api_key', key);
      alert('API Key successfully save ho gayi hai!');
    }

    async function analyzeWithAI() {
      const apiKey = localStorage.getItem('gemini_api_key') || document.getElementById('geminiApiKey').value.trim();
      const inputText = document.getElementById('rawInput').value.trim();
      const loader = document.getElementById('loader');
      const reviewBox = document.getElementById('reviewBox');
      const errorBox = document.getElementById('errorBox');

      errorBox.style.display = 'none';
      reviewBox.style.display = 'none';

      if (!apiKey) {
        alert('Pehle step 1 mein API key save karein.');
        return;
      }
      if (!inputText) {
        alert('Kripya service ya scheme ka naam dalein.');
        return;
      }

      loader.style.display = 'block';

      const prompt = `Act as an official government service analyzer for Delhi and Central India schemes. Extract data for: "${inputText}".
Respond ONLY with a raw valid JSON object (no markdown formatting, no backticks):
{
  "name": "Full scheme/service name",
  "category": "Identity or Certificates or Transport or Passport or Pension or Scholarship or Schemes",
  "description": "Short summary",
  "fee": "Official fee like ₹0 (Free) or exact rupees",
  "processing_time": "Estimated days/time",
  "eligibility": "Brief eligibility conditions",
  "documents": ["Document 1", "Document 2", "Document 3"]
}`;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }]
          })
        });

        const data = await response.json();

        if (data.error) {
          throw new Error(data.error.message || 'Gemini API Error');
        }

        if (!data.candidates || !data.candidates[0] || !data.candidates[0].content) {
          throw new Error('API ne response nahi diya. Kripya API key verify karein.');
        }

        let text = data.candidates[0].content.parts[0].text.trim();
        text = text.replace(/```json/gi, '').replace(/```/g, '').trim();

        const parsed = JSON.parse(text);

        document.getElementById('draftName').value = parsed.name || inputText;
        document.getElementById('draftCategory').value = parsed.category || 'Schemes';
        document.getElementById('draftFee').value = parsed.fee || '₹0 (Free)';
        document.getElementById('draftTime').value = parsed.processing_time || '15 - 30 Days';
        document.getElementById('draftEligibility').value = parsed.eligibility || 'Eligible residents';
        document.getElementById('draftDesc').value = parsed.description || '';
        document.getElementById('draftDocs').value = (parsed.documents || []).join('\n');

        loader.style.display = 'none';
        reviewBox.style.display = 'block';
      } catch (err) {
        loader.style.display = 'none';
        errorBox.innerText = 'Error: ' + err.message;
        errorBox.style.display = 'block';
      }
    }

    function approveAndCopy() {
      const obj = {
        name: document.getElementById('draftName').value.trim(),
        category: document.getElementById('draftCategory').value,
        description: document.getElementById('draftDesc').value.trim(),
        fee: document.getElementById('draftFee').value.trim(),
        processing_time: document.getElementById('draftTime').value.trim(),
        eligibility: document.getElementById('draftEligibility').value.trim(),
        documents: document.getElementById('draftDocs').value.split('\n').map(d => d.trim()).filter(Boolean)
      };

      navigator.clipboard.writeText(JSON.stringify(obj, null, 2));
      alert(`✅ "${obj.name}" Approve ho gaya!\nData clipboard par copy ho chuka hai.`);
      document.getElementById('reviewBox').style.display = 'none';
      document.getElementById('rawInput').value = '';
    }
  </script>
</body>
</html>
